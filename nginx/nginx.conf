worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # 限流区域：API 每秒 100 请求/IP，Webhook 每秒 200 请求/IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=200r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 上游：Spring Boot 应用，支持 keepalive
    upstream devflow_backend {
        server app:8080 max_fails=3 fail_timeout=30s;
        keepalive 50;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS 证书（部署时挂载真实证书到此路径）
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 10m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # 通用 proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 健康检查（不限流）
        location /actuator/health {
            proxy_pass http://devflow_backend;
        }

        # Webhook 端点（较高限流给 GitHub burst）
        location /webhook/ {
            limit_req zone=webhook_limit burst=20 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://devflow_backend;
        }

        # API 端点
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://devflow_backend;
        }

        # Swagger 文档
        location /doc.html {
            limit_req zone=api_limit burst=5;
            proxy_pass http://devflow_backend;
        }

        location /swagger-ui/ {
            proxy_pass http://devflow_backend;
        }

        location /v3/api-docs/ {
            proxy_pass http://devflow_backend;
        }

        location /webjars/ {
            proxy_pass http://devflow_backend;
        }
    }
}
